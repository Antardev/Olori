  <path d="M 270.5 150 C 270.5 150, 219.3 165, 219.3 178 C 219.3 250, 242.9 300, 242.9 330 L 174.1 560 Q 300 590, 425.9 560 L 357.1 330 C 357.1 300, 380.7 250, 380.7 178 C 380.7 165, 329.5 150, 329.5 150 Z" fill="none" stroke="#23201B" stroke-opacity="0.35" stroke-width="1.5"/>

