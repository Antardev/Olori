    <clipPath id="body"><path d="M 277.2 150 C 277.2 150, 237.7 165, 237.7 178 C 237.7 250, 255.9 300, 255.9 330 L 202.7 560 Q 300 590, 397.3 560 L 344.1 330 C 344.1 300, 362.3 250, 362.3 178 C 362.3 165, 322.8 150, 322.8 150 Z"/></clipPath>
